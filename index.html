<script>
'use strict';
const APP='LWTE_8';
const now=new Date();
const defaults={swr:4,returnRate:7,inflation:2,retirementAge:55,targetMode:'expense',fixedTarget:1200000,emergencyMonths:6,monthlyExtra:0,cryptoShare:25};
const sampleMonths={};
function demoMonth(){return{income:[tx('Gehalt',6000,true),tx('Nebenjob',500,true)],expenses:[tx('Wohnen',1200,true),tx('Lebensmittel',600,true),tx('Versicherungen',400,true),tx('Mobilität',300,true),tx('Freizeit',300,false),tx('Sonstiges',200,false)],invest:[tx('ETF',1000,true),tx('Bitcoin',500,true),tx('Cash Reserve',500,true)]}}
function tx(name,val,recurring=false,cat=''){return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,val:+val||0,recurring,cat}}
const defaultAssets=[{id:'a1',name:'ETF',value:57000,type:'ETF',cost:42000,rate:7},{id:'a2',name:'Bitcoin',value:35600,type:'Crypto',cost:18000,rate:12},{id:'a3',name:'Depot',value:21400,type:'Aktien',cost:16000,rate:7},{id:'a4',name:'Cash',value:14300,type:'Cash',cost:14300,rate:1},{id:'a5',name:'Immobilien',value:9800,type:'Immobilie',cost:7000,rate:3},{id:'a6',name:'Sonstige',value:4400,type:'Sonstige',cost:3000,rate:2}];
const initial={version:8,settings:{...defaults},months:{},assets:defaultAssets,liabilities:[],goals:[{id:'g1',name:'FIRE',target:1200000,current:0,deadline:2042},{id:'g2',name:'Notgroschen',target:15000,current:0,deadline:2027}],meta:{created:new Date().toISOString()}};
let state=loadState();let UI={year:now.getFullYear(),month:now.getMonth()+1,view:'dashboard',stealth:false,coins:[],sim:{extra:2000,returnRate:7,crash:0,years:15},risk:null};
function loadState(){try{let raw=localStorage.getItem(APP)||localStorage.getItem('LWTE_5');let x=raw?JSON.parse(raw):null;if(x&&[4,5,6,7,8].includes(x.version))return {...x,version:8,settings:{...defaults,...(x.settings||{})},months:x.months||{},assets:x.assets||[],liabilities:x.liabilities||[],goals:x.goals||[]}}catch(e){}let x=structuredClone?structuredClone(initial):JSON.parse(JSON.stringify(initial));x.months[`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`]=demoMonth();return x}
function save(){localStorage.setItem(APP,JSON.stringify(state))}
function key(y=UI.year,m=UI.month){return `${y}-${String(m).padStart(2,'0')}`}
function getMonth(y=UI.year,m=UI.month,create=true){let k=key(y,m);if(!state.months[k]&&create)state.months[k]={income:[],expenses:[],invest:[]};return state.months[k]||{income:[],expenses:[],invest:[]}}
function sum(a){return(a||[]).reduce((s,x)=>s+(Number(x.val)||0),0)}
function totals(d){return{income:sum(d.income),expenses:sum(d.expenses),invest:sum(d.invest)}}
function assetsTotal(){return state.assets.reduce((s,a)=>s+(Number(a.value)||0),0)}
function debtTotal(){return state.liabilities.reduce((s,a)=>s+(Number(a.value)||0),0)}
function netWorth(){return assetsTotal()-debtTotal()}
function stressNetWorth(type){let a=0;state.assets.forEach(x=>{let v=Number(x.value)||0;if(type===.3&&(x.type==='ETF'||x.type==='Aktien'))v*=.7;if(type===.6&&x.type==='Crypto')v*=.4;a+=v});return a-debtTotal()}
function realReturn(nom=state.settings.returnRate){return ((1+Number(nom)/100)/(1+Number(state.settings.inflation)/100)-1)*100}
function goalCurrent(g){if(g.name==='FIRE')return netWorth();if(g.name.toLowerCase().includes('notgroschen'))return state.assets.filter(a=>a.type==='Cash').reduce((s,a)=>s+Number(a.value||0),0);return Number(g.current)||0}
function euro(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0)}
function pct(n){return `${(Number(n)||0).toFixed(1)}%`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthName(m){return new Intl.DateTimeFormat('de-DE',{month:'long'}).format(new Date(2020,m-1,1))}
function annualExpenses(d){return totals(d).expenses*12}
function fireTarget(d,sw=state.settings.swr){return state.settings.targetMode==='fixed'?Number(state.settings.fixedTarget)||0:annualExpenses(d)*100/sw}
function monthlyInvest(d){return totals(d).invest+Number(state.settings.monthlyExtra||0)}
function fireYears(d,extra=0,returnRate=state.settings.returnRate,start=netWorth(),target=fireTarget(d)){if(start>=target)return 0;let p=Number(start),r=Number(returnRate)/100/12,con=totals(d).invest+Number(extra||0);if(con<=0)return 999;if(r===0)return (target-p)/con/12;for(let i=1;i<=1200;i++){p=p*(1+r)+con;if(p>=target)return i/12}return 999}
function projectedSeries(d,years=15,returnRate=state.settings.returnRate,extra=state.settings.monthlyExtra,start=netWorth(),crash=0){let r=returnRate/100/12,con=totals(d).invest+Number(extra||0),p=start,out=[];if(crash) p*=1-crash;for(let y=0;y<=years;y++){out.push({year:y,value:p});for(let i=0;i<12;i++)p=p*(1+r)+con}return out}
function I(name){const p={home:'M3 10.5 12 3l9 7.5M5 9v11h14V9M9 20v-6h6v6',wallet:'M4 6h16v13H4zM4 9h16M15 13h2',flow:'M4 7h12m0 0-3-3m3 3-3 3M20 17H8m0 0 3-3m-3 3 3 3',fire:'M12 21c4.2 0 7-2.7 7-6.6 0-3.2-2-5.5-4.6-7.7.1 2.3-1 3.8-2.4 4.7.2-4.1-1.5-7-4.4-9.4.2 3.4-2.6 5.8-2.6 9.4C5 17.8 7.9 21 12 21z',sliders:'M4 6h16M4 12h16M4 18h16M9 6v0M15 12v0M11 18v0',chart:'M4 19V5M4 19h16M7 15l4-4 3 2 5-7',calendar:'M5 4h14v16H5zM8 2v4m8-4v4M5 9h14',pie:'M12 3a9 9 0 1 0 9 9h-9zM12 3v9h9',coin:'M12 3v18M8.5 7.5c.8-1 2-1.5 3.7-1.5 2.3 0 3.8 1.1 3.8 2.8 0 4.2-7.5 1.9-7.5 5.6 0 1.7 1.5 2.8 3.8 2.8 1.7 0 3-.5 3.8-1.5',target:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',shield:'M12 3l7 3v5c0 4.5-2.9 7.8-7 10-4.1-2.2-7-5.5-7-10V6zM9 12l2 2 4-4',pulse:'M3 12h4l2-5 4 10 2-5h6',settings:'M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 12h2M3 12h2M12 3v2M12 19v2',plus:'M12 5v14M5 12h14',moon:'M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2z',eyeOff:'M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.6 10.6 0 0 1 12 5c5 0 8.7 4 9.8 7-.4 1.1-1.3 2.5-2.6 3.7',chevronLeft:'M15 18l-6-6 6-6',chevronRight:'M9 18l6-6-6-6',today:'M12 8v4l3 2'};return `<svg viewBox="0 0 24 24"><path d="${p[name]||p.target}"></path></svg>`}
function paintIcons(){document.querySelectorAll('[data-icon]').forEach(el=>{if(!el.innerHTML.trim())el.innerHTML=I(el.dataset.icon)})}
function q(label,value,sub,icon,cls=''){return `<div class="card kpi"><span class="kicon">${I(icon)}</span><div class="klabel">${label}</div><div class="kvalue sensitive ${cls}">${value}</div><div class="ksub">${sub}</div></div>`}
function metric(label,value){return `<div class="metric"><span>${label}</span><b class="sensitive">${value}</b></div>`}
function stat(label,value,cls=''){return `<div class="stat"><span>${label}</span><b class="sensitive ${cls}">${value}</b></div>`}
function donut(){let total=Math.max(netWorth(),1);let groups={ETF:0,Crypto:0,Aktien:0,Cash:0,Immobilie:0,Sonstige:0};state.assets.forEach(a=>groups[a.type]=(groups[a.type]||0)+Number(a.value||0));let colors=['#1688ff','#ff9c24','#7d57ff','#20d8bd','#d5c7a8','#93dc35'];let labels=Object.entries(groups).filter(x=>x[1]>0);let deg=0;let stops=labels.map((x,i)=>{let s=deg;deg+=x[1]/total*360;return `${colors[i%colors.length]} ${s}deg ${deg}deg`}).join(',');return `<div class="donut" style="background:conic-gradient(${stops})"><div class="donutCenter sensitive">${euro(netWorth())}<small>${pct(100)}</small></div></div>`}
function allocationLegend(){let total=Math.max(netWorth(),1),groups={ETF:0,Crypto:0,Aktien:0,Cash:0,Immobilie:0,Sonstige:0},colors=['#1688ff','#ff9c24','#7d57ff','#20d8bd','#d5c7a8','#93dc35'];state.assets.forEach(a=>groups[a.type]=(groups[a.type]||0)+Number(a.value||0));return `<div class="legend">${Object.entries(groups).filter(x=>x[1]>0).map((x,i)=>`<div class="legendRow"><i class="sw" style="background:${colors[i%colors.length]}"></i><span>${x[0]}</span><b>${pct(x[1]/total*100)}</b><span class="sensitive">${euro(x[1])}</span></div>`).join('')}</div>`}
function sankey(d){let t=totals(d),outs=[...d.expenses.map(x=>[x.name,x.val,'#ff4f70']),...d.invest.map(x=>[x.name,x.val,'#9667ff'])];let leftover=Math.max(0,t.income-t.expenses-t.invest);if(leftover)outs.push(['Liquidität',leftover,'#1688ff']);let total=outs.reduce((s,x)=>s+x[1],0)||1,y=18;let svg=`<svg class="chart" viewBox="0 0 760 250"><rect x="15" y="85" width="120" height="75" rx="12" fill="#18d9c0"/><text x="75" y="116" text-anchor="middle" fill="white" font-size="12" font-weight="800">Einnahmen</text><text x="75" y="138" text-anchor="middle" fill="white" font-size="11">${euro(t.income)}</text>`;outs.sort((a,b)=>b[1]-a[1]).slice(0,9).forEach(o=>{let h=Math.max(9,180*o[1]/total),cy=y+h/2;svg+=`<path d="M135 122 C290 ${cy},410 ${cy},500 ${cy}" fill="none" stroke="${o[2]}" stroke-width="${Math.max(4,24*o[1]/Math.max(t.income,1))}" opacity=".48" stroke-linecap="round"/><rect x="500" y="${y}" width="245" height="${h}" rx="8" fill="${o[2]}"/><text x="622" y="${cy-2}" text-anchor="middle" fill="white" font-size="10" font-weight="800">${esc(o[0])}</text><text x="622" y="${cy+12}" text-anchor="middle" fill="white" font-size="9">${euro(o[1])}</text>`;y+=h+4});return svg+'</svg>'}
function lineChart(series,goal){let max=Math.max(goal||0,...series.map(x=>x.value),1),min=Math.min(0,...series.map(x=>x.value));let pts=series.map((x,i)=>`${35+i*(730/(series.length-1))},${215-(x.value-min)/(max-min)*180}`).join(' ');let g=goal?`<line x1="35" x2="765" y1="${215-(goal-min)/(max-min)*180}" y2="${215-(goal-min)/(max-min)*180}" stroke="#ff4f70" stroke-dasharray="6 5"/><text x="760" y="${210-(goal-min)/(max-min)*180}" text-anchor="end" fill="#ff6a85" font-size="9">FIRE Ziel ${euro(goal)}</text>`:'';return `<svg class="chart" viewBox="0 0 800 240"><line x1="35" y1="215" x2="765" y2="215" stroke="var(--line)"/>${g}<polyline points="${pts}" fill="none" stroke="#19d9c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${series.map((x,i)=>`<circle cx="${35+i*(730/(series.length-1))}" cy="${215-(x.value-min)/(max-min)*180}" r="3.5" fill="#19d9c0"/><text x="${35+i*(730/(series.length-1))}" y="232" text-anchor="middle" fill="var(--muted)" font-size="9">${x.year}</text>`).join('')}</svg>`}
function dashboard(){let d=getMonth(),t=totals(d),cash=t.income-t.expenses-t.invest,saveRate=t.income?(t.income-t.expenses)/t.income*100:0,fy=fireYears(d),target=fireTarget(d);return `<div class="grid kpis">${q('Net Worth',euro(netWorth()),'Assets minus Schulden','wallet','blue')}${q('Cashflow',euro(cash),cash>=0?'positiv':'negativ','⇆',cash>=0?'green':'red')}${q('Sparquote',pct(saveRate),'vor Investments','pie','cyan')}${q('FIRE Countdown',fy===999?'N/A':fy.toFixed(1)+' Jahre',`Ziel ${euro(target)}`,'fire','purple')}${q('Investments / Monat',euro(t.invest),'aktiver Monat','chart','blue')}${q('Daily Burn',euro(t.expenses/30),'Ausgaben pro Tag','pulse','orange')}</div><div class="grid dash"><div class="card"><div class="toolbar"><div><h2>Vermögensaufstellung</h2><span class="sub">Net Worth und Allocation</span></div><button class="ghost" data-nav="portfolio">Details</button></div><div class="alloc">${donut()}${allocationLegend()}</div></div><div class="card"><div class="toolbar"><div><h2>Cashflow Anatomy</h2><span class="sub">Wohin fließt dein Geld?</span></div><button class="ghost" data-nav="cashflow">Bearbeiten</button></div>${sankey(d,t)}</div><div class="card"><div class="toolbar"><h2>${monthName(UI.month)} ${UI.year}</h2></div>${stat('Einnahmen',euro(t.income))}${stat('Ausgaben',euro(t.expenses),'red')}${stat('Investments',euro(t.invest),'purple')}${stat('Cashflow',euro(cash),cash>=0?'green':'red')}${stat('Ausgabenquote',pct(t.income?t.expenses/t.income*100:0))}${stat('größter Ausgabenposten',largest(d.expenses))}<div class="addRow"><button class="primary" data-action="quick">＋ Eintrag</button><button class="ghost" data-nav="cashflow">Cashflow</button></div></div></div><div class="grid lower"><div class="card"><div class="toolbar"><h2>FIRE Cockpit</h2><span class="sub">4% SWR = ${euro(target)}</span></div><div class="metricGrid">${metric('Jahresausgaben',euro(annualExpenses(d)))}${metric('Zielvermögen',euro(target))}${metric('SWR',pct(state.settings.swr))}${metric('Rendite',pct(state.settings.returnRate))}${metric('Notgroschen',euro(t.expenses*state.settings.emergencyMonths))}${metric('FIRE Alter',fy===999?'N/A':Math.round(new Date().getFullYear()+fy))}</div></div><div class="card"><div class="toolbar"><h2>Tactical FIRE Simulator</h2><span class="sub">zusätzliche Monatsrate</span></div><input class="slider" id="dashExtra" type="range" min="0" max="5000" step="100" value="${UI.sim.extra}"><div class="bigNum sensitive">${euro(UI.sim.extra)}</div><div>FIRE in <b>${fireYears(d,UI.sim.extra)===999?'N/A':fireYears(d,UI.sim.extra).toFixed(1)+' Jahren'}</b></div><div class="green">Zeitgewinn ${fy===999?'N/A':Math.max(0,fy-fireYears(d,UI.sim.extra)).toFixed(1)+' Jahre'}</div></div><div class="card"><div class="toolbar"><h2>Crash Szenarien</h2><span class="sub">Auswirkung auf Net Worth</span></div><div class="scenarioGrid">${scenario('Normal',0)}${scenario('TradFi',.3)}${scenario('Crypto',.6)}</div><div class="notice" style="margin-top:10px">${UI.sim.crash?`Stress-Test: Net Worth ${euro(stressNetWorth(UI.sim.crash))}`:'Wähle ein Szenario für den Stress-Test.'}</div></div></div><div class="grid wide"><div class="card"><div class="toolbar"><div><h2>10-Jahres-Projektion</h2><span class="sub">${state.settings.returnRate}% p.a. · aktuelle Sparrate</span></div><button class="ghost" data-nav="projection">Vollansicht</button></div>${lineChart(projectedSeries(d,10,state.settings.returnRate,state.settings.monthlyExtra),target)}</div><div class="card"><div class="toolbar"><h2>Milestones</h2><button class="ghost" data-nav="goals">Alle</button></div>${goalMini()}</div></div>`}
function scenario(name,v){return `<button class="scenario ${UI.sim.crash===v?'active':''}" data-crash="${v}">${name}<b>${v?`-${v*100}%`:'Basis'}</b></button>`}
function largest(a){let x=(a||[]).slice().sort((a,b)=>b.val-a.val)[0];return x?esc(x.name):'—'}
function goalMini(){return state.goals.slice(0,4).map(g=>{let cur=goalCurrent(g),p=Math.min(100,cur/g.target*100);return `<div class="goal"><div class="goalTop"><span>${esc(g.name)}</span><b>${euro(cur)} / ${euro(g.target)}</b></div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`}).join('')}
function entries(cat){let d=getMonth(),arr=d[cat]||[];return `<div>${arr.map(x=>`<div class="entry" data-cat="${cat}" data-id="${x.id}"><input class="input name" value="${esc(x.name)}"><input class="input amount sensitive" type="number" step="0.01" value="${x.val}"><label class="toggle"><input class="rec" type="checkbox" ${x.recurring?'checked':''}>wiederkehrend</label><button class="danger del" title="löschen">×</button></div>`).join('')}</div><div class="addRow"><input class="input grow newName" placeholder="Bezeichnung"><input class="input" style="width:120px" type="number" step="0.01" placeholder="€" data-new="val"><label class="toggle"><input type="checkbox" data-new="rec">wiederkehrend</label><button class="primary addEntry" data-cat="${cat}">＋</button></div>`}
function cashflow(){let d=getMonth(),t=totals(d);return `<div class="toolbar"><div><h1 class="sectionTitle">Cashflow</h1><p class="sectionSub">Monatliche Einnahmen, Ausgaben und Investments verwalten.</p></div><div><button class="ghost" data-action="applyRecurring">↻ Recurring anwenden</button><button class="primary" data-action="copyPrev">Kopiere Vormonat</button></div></div><div class="grid monthGrid" style="grid-template-columns:repeat(3,1fr)"><div class="card"><div class="toolbar"><h2>Einnahmen</h2><b class="green">${euro(t.income)}</b></div>${entries('income')}</div><div class="card"><div class="toolbar"><h2>Ausgaben</h2><b class="red">${euro(t.expenses)}</b></div>${entries('expenses')}</div><div class="card"><div class="toolbar"><h2>Investments</h2><b class="purple">${euro(t.invest)}</b></div>${entries('invest')}</div></div>`}
function wealth(){return `<div class="toolbar"><div><h1 class="sectionTitle">Vermögen</h1><p class="sectionSub">Assets, Einstandswerte, erwartete Renditen und Schulden.</p></div><button class="primary" data-action="addAsset">＋ Asset</button></div><div class="grid wide"><div class="card"><div class="toolbar"><h2>Assets</h2><b>${euro(assetsTotal())}</b></div>${state.assets.map(a=>`<div class="assetCard" data-asset="${a.id}"><input class="input assetName" value="${esc(a.name)}"><input class="input assetVal sensitive" type="number" value="${a.value}"><select class="input assetType"><option ${a.type==='ETF'?'selected':''}>ETF</option><option ${a.type==='Crypto'?'selected':''}>Crypto</option><option ${a.type==='Aktien'?'selected':''}>Aktien</option><option ${a.type==='Cash'?'selected':''}>Cash</option><option ${a.type==='Immobilie'?'selected':''}>Immobilie</option><option ${a.type==='Sonstige'?'selected':''}>Sonstige</option></select><button class="danger assetDel">×</button></div>`).join('')}</div><div class="card"><div class="toolbar"><h2>Schulden</h2><button class="primary" data-action="addDebt">＋ Schuld</button></div>${state.liabilities.map(a=>`<div class="assetCard" data-debt="${a.id}"><input class="input debtName" value="${esc(a.name)}"><input class="input debtVal sensitive" type="number" value="${a.value}"><span class="assetType">${esc(a.type||'Schuld')}</span><button class="danger debtDel">×</button></div>`).join('')}<div class="sub" style="margin-top:8px">Gesamt: ${euro(debtTotal())}</div></div><div class="card"><h2>Vermögenskennzahlen</h2>${stat('Assets',euro(assetsTotal()))}${stat('Schulden',euro(debtTotal()),'red')}${stat('Net Worth',euro(netWorth()),'green')}${stat('Liquidität',euro(state.assets.filter(a=>a.type==='Cash').reduce((s,a)=>s+a.value,0)))}${stat('FIRE Fortschritt',pct(netWorth()/fireTarget(getMonth())*100))}</div></div>`}
function portfolio(){return `<div class="grid wide"><div class="card"><div class="toolbar"><div><h1 class="sectionTitle">Portfolio</h1><p class="sectionSub">Allocation und Konzentrationsrisiko.</p></div></div>${donut()}<div style="margin-top:10px">${allocationLegend()}</div></div><div class="card"><h2>Risiko-Check</h2>${riskRows()}</div></div>`}
function riskRows(){let total=Math.max(netWorth(),1),crypto=state.assets.filter(a=>a.type==='Crypto').reduce((s,a)=>s+a.value,0),cash=state.assets.filter(a=>a.type==='Cash').reduce((s,a)=>s+a.value,0);return `${stat('Crypto Anteil',pct(crypto/total*100),crypto/total>.3?'red':'green')}${stat('Cash Anteil',pct(cash/total*100),cash/total<.05?'red':'green')}${stat('Größte Position',largestAsset())}${stat('FIRE Ziel',euro(fireTarget(getMonth())))}`}
function largestAsset(){let a=state.assets.slice().sort((a,b)=>b.value-a.value)[0];return a?`${esc(a.name)} · ${euro(a.value)}`:'—'}
function fire(){let d=getMonth(),t=totals(d),target=fireTarget(d),fy=fireYears(d),safe=t.expenses*state.settings.emergencyMonths;return `<div class="toolbar"><div><h1 class="sectionTitle">FIRE Engine</h1><p class="sectionSub">Finanzielle Unabhängigkeit mit transparenten Annahmen.</p></div><button class="primary" data-nav="settings">Annahmen bearbeiten</button></div><div class="grid kpis">${q('Net Worth',euro(netWorth()),'aktuell','wallet')}${q('FIRE Ziel',euro(target),'dynamisch/fix','fire','purple')}${q('FIRE Countdown',fy===999?'N/A':fy.toFixed(1)+' Jahre','bei aktueller Rate','pulse')}${q('SWR',pct(state.settings.swr),'Entnahmerate','pie')}${q('Notgroschen',euro(safe),'Ziel','◇')}${q('Jahresausgaben',euro(annualExpenses(d)),'aktuell','chart','red')}</div><div class="grid lower"><div class="card"><h2>FIRE Mathematik</h2><div class="metricGrid">${metric('Monatliche Investments',euro(t.invest))}${metric('Zusatzrate',euro(state.settings.monthlyExtra))}${metric('Rendite',pct(state.settings.returnRate))}${metric('Inflation',pct(state.settings.inflation))}${metric('Realrendite',pct(realReturn()))}${metric('Zielvermögen',euro(target))}${metric('FIRE Fortschritt',pct(netWorth()/Math.max(target,1)*100))}</div></div><div class="card"><h2>Was wenn?</h2>${fireTable(d)}</div><div class="card"><h2>Notgroschen</h2>${stat('Monatliche Ausgaben',euro(t.expenses))}${stat('Zielmonate',state.settings.emergencyMonths)}${stat('Zielbetrag',euro(safe))}${stat('Aktuelles Cash',euro(state.assets.filter(a=>a.type==='Cash').reduce((s,a)=>s+a.value,0)))}</div></div>`}
function fireTable(d){let base=fireYears(d),rows=[['Aktuell',0,base],['+500 €',500,fireYears(d,500)],['+1.000 €',1000,fireYears(d,1000)],['+2.000 €',2000,fireYears(d,2000)],['+5.000 €',5000,fireYears(d,5000)]];return `<table class="table"><tr><th>Szenario</th><th>Extra</th><th>FIRE</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${euro(r[1])}</td><td>${r[2]===999?'N/A':r[2].toFixed(1)+' J'}</td></tr>`).join('')}</table>`}
function simulator(){let d=getMonth(),base=fireYears(d),sim=fireYears(d,UI.sim.extra,UI.sim.returnRate,netWorth()*(1-UI.sim.crash)),series=projectedSeries(d,UI.sim.years,UI.sim.returnRate,UI.sim.extra,netWorth(),UI.sim.crash);return `<div class="toolbar"><div><h1 class="sectionTitle">Tactical FIRE Simulator</h1><p class="sectionSub">Parameter verändern und Wirkung sofort sehen.</p></div><button class="ghost" data-action="resetSim">Reset</button></div><div class="grid lower"><div class="card"><h2>Monatlicher Zusatzbetrag</h2><div class="bigNum sensitive">${euro(UI.sim.extra)}</div><input id="simExtra" class="slider" type="range" min="0" max="10000" step="100" value="${UI.sim.extra}"><div class="sub">0 € bis 10.000 €</div></div><div class="card"><h2>Rendite</h2><div class="bigNum">${pct(UI.sim.returnRate)}</div><input id="simReturn" class="slider" type="range" min="0" max="15" step="0.5" value="${UI.sim.returnRate}"><div class="sub">Nominal p.a.</div></div><div class="card"><h2>Crash</h2><div class="scenarioGrid">${scenario('0%',0)}${scenario('-30%',.3)}${scenario('-60%',.6)}</div><div class="sub" style="margin-top:8px">Einmaliger Schock zu Beginn.</div></div></div><div class="grid wide"><div class="card"><h2>Ergebnis</h2><div class="metricGrid">${metric('Basis FIRE',base===999?'N/A':base.toFixed(1)+' Jahre')}${metric('Simulation',sim===999?'N/A':sim.toFixed(1)+' Jahre')}${metric('Zeitgewinn',base===999?'N/A':Math.max(0,base-sim).toFixed(1)+' Jahre')}${metric('Endvermögen',euro(series.at(-1).value))}</div>${lineChart(series,fireTarget(d))}</div><div class="card"><h2>Parameter</h2>${stat('Aktuelle Investition',euro(totals(d).invest))}${stat('Zusatzbetrag',euro(UI.sim.extra))}${stat('Gesamtrate',euro(totals(d).invest+UI.sim.extra))}${stat('Rendite',pct(UI.sim.returnRate))}${stat('Crash',pct(UI.sim.crash*100),'red')}</div></div>`}
function projection(){let d=getMonth(),series=projectedSeries(d,20,state.settings.returnRate,state.settings.monthlyExtra);return `<div class="toolbar"><div><h1 class="sectionTitle">Vermögensprojektion</h1><p class="sectionSub">20 Jahre · ${state.settings.returnRate}% nominal · ${state.settings.inflation}% Inflation · ${realReturn().toFixed(1)}% real.</p></div></div><div class="card">${lineChart(series,fireTarget(d))}</div><div class="grid monthGrid" style="grid-template-columns:repeat(4,1fr);margin-top:14px">${series.filter((x,i)=>[0,5,10,15,20].includes(i)).map(x=>`<div class="card">${metric('Jahr '+(UI.year+x.year),euro(x.value))}</div>`).join('')}</div>`}
function year(){let rows=[],yi=0,ye=0,iv=0;for(let m=1;m<=12;m++){let d=getMonth(UI.year,m,false),t=totals(d);if(t.income||t.expenses||t.invest){rows.push({m,t});yi+=t.income;ye+=t.expenses;iv+=t.invest}}return `<div class="toolbar"><div><h1 class="sectionTitle">Jahresübersicht ${UI.year}</h1><p class="sectionSub">Monatliche Entwicklung und Jahreskennzahlen.</p></div><select class="input" id="yearSelect">${Array.from({length:7},(_,i)=>UI.year-3+i).map(y=>`<option ${y===UI.year?'selected':''}>${y}</option>`).join('')}</select></div><div class="grid kpis">${q('Income',euro(yi),'Jahr','↗')}${q('Expenses',euro(ye),'Jahr','chart')}${q('Investments',euro(iv),'Jahr','chart')}${q('Sparquote',pct(yi?(yi-ye)/yi*100:0),'Jahr','pie')}${q('Cashflow',euro(yi-ye),'Jahr','flow')}${q('Ø monatlich',euro((yi-ye)/12),'Cashflow','pulse')}</div><div class="card" style="margin-top:14px"><table class="table"><tr><th>Monat</th><th>Income</th><th>Expenses</th><th>Invest</th><th>Cashflow</th><th>Sparquote</th></tr>${rows.map(r=>`<tr><td>${monthName(r.m)}</td><td>${euro(r.t.income)}</td><td>${euro(r.t.expenses)}</td><td>${euro(r.t.invest)}</td><td class="${r.t.income-r.t.expenses>=0?'green':'red'}">${euro(r.t.income-r.t.expenses)}</td><td>${pct(r.t.income?(r.t.income-r.t.expenses)/r.t.income*100:0)}</td></tr>`).join('')}</table></div>`}
function crypto(){return `<div class="toolbar"><div><h1 class="sectionTitle">Krypto</h1><p class="sectionSub">Live Market Data, optional. Die App funktioniert auch offline.</p></div><button class="primary" data-action="refreshCrypto">↻ Aktualisieren</button></div><div class="card"><table class="table"><tr><th>Asset</th><th>Preis EUR</th><th>24h</th><th>Market Cap</th></tr>${UI.coins.length?UI.coins.map(c=>`<tr><td style="text-align:left"><b>${esc(c.name)}</b> · ${esc(c.symbol.toUpperCase())}</td><td>${euro(c.current_price)}</td><td class="${c.price_change_percentage_24h>=0?'green':'red'}">${(c.price_change_percentage_24h||0).toFixed(2)}%</td><td>${euro(c.market_cap)}</td></tr>`).join(''):'<tr><td colspan="4">Noch keine Live-Daten. Klicke Aktualisieren oder prüfe die Internetverbindung.</td></tr>'}</table></div>`}
function goals(){return `<div class="toolbar"><div><h1 class="sectionTitle">Ziele</h1><p class="sectionSub">FIRE, Notgroschen und frei definierbare Vermögensziele.</p></div><button class="primary" data-action="addGoal">＋ Ziel</button></div><div class="card">${state.goals.map(g=>{let cur=goalCurrent(g),p=Math.min(100,cur/Math.max(g.target,1)*100);return `<div class="goal" data-goal="${g.id}"><div class="goalTop"><input class="input goalName" value="${esc(g.name)}"><span class="sensitive">${euro(cur)} / ${euro(g.target)}</span><button class="danger goalDel">×</button></div><div class="formGrid" style="margin-top:8px"><div class="field"><label>Zielbetrag</label><input class="input goalTarget" type="number" value="${g.target}"></div><div class="field"><label>Deadline</label><input class="input goalDeadline" type="number" value="${g.deadline||''}"></div></div><div class="progress" style="margin-top:8px"><i style="width:${p}%"></i></div><div class="sub" style="margin-top:4px">${p.toFixed(0)}% erreicht</div></div>`}).join('')}</div>`}
function liquidityRunway(){let d=getMonth(),cash=state.assets.filter(a=>a.type==='Cash').reduce((s,a)=>s+Number(a.value||0),0),monthly=totals(d).expenses;return monthly>0?cash/monthly:0}
function twelveMonthStats(){let income=0,expenses=0,invest=0,months=0,series=[];for(let i=0;i<12;i++){let dt=new Date(UI.year,UI.month-1-i,1),d=getMonth(dt.getFullYear(),dt.getMonth()+1,false),t=totals(d);income+=t.income;expenses+=t.expenses;invest+=t.invest;if(t.income||t.expenses||t.invest)months++;series.unshift({label:monthName(dt.getMonth()+1).slice(0,3),rate:t.income?(t.income-t.expenses)/t.income*100:0})}return {income,expenses,invest,months,series,rate:income?(income-expenses)/income*100:0}}
function fireSafety(){let d=getMonth(),target=fireTarget(d),nw=netWorth(),base=nw/Math.max(target,1),stressNW=nw*.8,stressTarget=target*1.1;return {base,stress:stressNW/Math.max(stressTarget,1),gap:stressTarget-stressNW}}
function savingsTrendChart(series){let max=Math.max(1,...series.map(x=>x.rate)),min=Math.min(0,...series.map(x=>x.rate)),pts=series.map((x,i)=>`${25+i*(750/Math.max(series.length-1,1))},${215-(x.rate-min)/Math.max(max-min,1)*170}`).join(' ');return `<svg class="chart" viewBox="0 0 800 240"><line x1="25" y1="215" x2="775" y2="215" stroke="var(--line)"/><line x1="25" y1="130" x2="775" y2="130" stroke="var(--line)" stroke-dasharray="5 5"/><text x="770" y="125" text-anchor="end" fill="var(--muted)" font-size="9">0%</text><polyline points="${pts}" fill="none" stroke="#1688ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${series.map((x,i)=>`<circle cx="${25+i*(750/Math.max(series.length-1,1))}" cy="${215-(x.rate-min)/Math.max(max-min,1)*170}" r="3.5" fill="#1688ff"/><text x="${25+i*(750/Math.max(series.length-1,1))}" y="232" text-anchor="middle" fill="var(--muted)" font-size="9">${x.label}</text>`).join('')}</svg>`}
function financeCheck(){let d=getMonth(),t=totals(d),r=liquidityRunway(),s=twelveMonthStats(),f=fireSafety(),targetMonths=state.settings.emergencyMonths;let runwayClass=r>=targetMonths?'green':r>=targetMonths*.75?'orange':'red';let largestExp=(d.expenses||[]).slice().sort((a,b)=>b.val-a.val)[0];let topShare=t.expenses?largestExp.val/t.expenses*100:0;return `<div class="toolbar"><div><h1 class="sectionTitle">Finanz-Check</h1><p class="sectionSub">Zwei zusätzliche Kontrollinstrumente: Liquiditäts-Runway und FIRE-Sicherheitsmarge. Dazu ein 12-Monats-Blick auf deine Sparquote.</p></div><button class="ghost" data-nav="settings">Annahmen prüfen</button></div><div class="checkGrid"><div class="checkCard"><div class="label">LIQUIDITY RUNWAY</div><div class="value ${runwayClass}">${r.toFixed(1)} Monate</div><div class="hint">Cash / aktuelle Monatsausgaben · Ziel ${targetMonths} Monate</div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,r/Math.max(targetMonths,1)*100)}%"></i></div></div><div class="checkCard"><div class="label">FIRE SICHERHEITSMARGE</div><div class="value ${f.stress>=1?'green':f.stress>=.8?'orange':'red'}">${pct(f.base*100)}</div><div class="hint">Basis: Net Worth / FIRE Ziel · Stress: −20% Vermögen und +10% Ziel</div><div class="progress" style="margin-top:10px"><i style="width:${Math.min(100,f.stress*100)}%"></i></div></div><div class="checkCard"><div class="label">12-MONATS-SPARQUOTE</div><div class="value ${s.rate>=25?'green':s.rate>=10?'orange':'red'}">${pct(s.rate)}</div><div class="hint">${s.months} aktive Monate · Investments ${euro(s.invest)}</div></div></div><div class="grid wide" style="margin-top:14px"><div class="card"><div class="toolbar"><div><h2>Sparquoten-Trend</h2><span class="sub">Rolling 12 Monate</span></div><b>${pct(s.rate)}</b></div>${savingsTrendChart(s.series)}</div><div class="card"><h2>Risiko- und Liquiditätscheck</h2>${stat('Cash verfügbar',euro(state.assets.filter(a=>a.type==='Cash').reduce((x,a)=>x+a.value,0)))}${stat('Runway',r.toFixed(1)+' Monate',runwayClass)}${stat('FIRE Ziel',euro(fireTarget(d)))}${stat('Stress Gap',f.gap>0?euro(f.gap):'kein Gap',f.gap>0?'red':'green')}${stat('Größter Ausgabenposten',largestExp?esc(largestExp.name):'—')}${stat('Anteil größter Posten',pct(topShare),topShare>35?'red':'green')}<div class="notice" style="margin-top:12px">Der Check ersetzt keine Anlageberatung. Er soll dir früh zeigen, wo Liquidität, Sparrate oder FIRE-Puffer zu knapp werden.</div></div></div>`}
function calendarData(y,m){let first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),startDay=(first.getDay()+6)%7;let cells=[];for(let i=0;i<startDay;i++){let d=new Date(y,m-1,-(startDay-i-1));cells.push({day:d.getDate(),y:d.getFullYear(),m:d.getMonth()+1,other:true})}for(let day=1;day<=days;day++)cells.push({day,y,m,other:false});while(cells.length<42){let d=new Date(y,m-1,days+(cells.length-(startDay+days))+1);cells.push({day:d.getDate(),y:d.getFullYear(),m:d.getMonth()+1,other:true})}return cells}
function openCalendarWith(year,month){const oldY=UI.year,oldM=UI.month;UI.year=year;UI.month=month;openCalendar();UI.year=oldY;UI.month=oldM}
function openCalendar(){let y=UI.year,m=UI.month,cells=calendarData(y,m),days=['Mo','Di','Mi','Do','Fr','Sa','So'];let dataKeys=Object.keys(state.months);let body=`<div class="calendarShell"><div class="calendarBox"><div class="calendarHead"><button class="ghost" id="calPrev"><span class="icon" data-icon="chevronLeft"></span></button><div class="calendarTitle" id="calTitle">${monthName(m)} ${y}</div><button class="ghost" id="calNext"><span class="icon" data-icon="chevronRight"></span></button></div><div class="calendarWeek">${days.map(x=>`<div>${x}</div>`).join('')}</div><div class="calendarDays" id="calendarDays">${cells.map(c=>{let selected=c.y===UI.year&&c.m===UI.month&&!c.other,today=c.y===now.getFullYear()&&c.m===now.getMonth()+1&&c.day===now.getDate(),has=dataKeys.includes(`${c.y}-${String(c.m).padStart(2,'0')}`);return `<button class="calDay ${c.other?'other':''} ${selected?'selected':''} ${today?'today':''} ${has?'hasData':''}" data-y="${c.y}" data-m="${c.m}" data-d="${c.day}">${c.day}</button>`}).join('')}</div></div><div class="calendarBox calControls"><div class="field"><label>Jahr</label><select class="input" id="calYear">${Array.from({length:31},(_,i)=>now.getFullYear()-15+i).map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Monat</label><select class="input" id="calMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${monthName(i+1)}</option>`).join('')}</select></div><div class="calendarHint">Grüne Punkte markieren Monate, in denen bereits Finanzdaten gespeichert sind. Ein Klick auf einen Tag öffnet den zugehörigen Monat.</div><div class="calJump"><button class="ghost" id="calToday">Heute</button><button class="primary" id="calGo">Monat öffnen</button></div></div></div>`;openModal('Kalender','Monat auswählen',body);paintIcons();const rerender=()=>{closeModal();openCalendarWith(y,m)};document.getElementById('calPrev').onclick=()=>{let d=new Date(y,m-2,1);y=d.getFullYear();m=d.getMonth()+1;rerender()};document.getElementById('calNext').onclick=()=>{let d=new Date(y,m,1);y=d.getFullYear();m=d.getMonth()+1;rerender()};document.getElementById('calYear').onchange=e=>{y=Number(e.target.value);rerender()};document.getElementById('calMonth').onchange=e=>{m=Number(e.target.value);rerender()};document.getElementById('calToday').onclick=()=>{UI.year=now.getFullYear();UI.month=now.getMonth()+1;getMonth();closeModal();render();toast('Aktueller Monat geöffnet')};document.getElementById('calGo').onclick=()=>{UI.year=y;UI.month=m;getMonth();closeModal();render();toast(`Geöffnet: ${monthName(m)} ${y}`)};document.querySelectorAll('.calDay').forEach(b=>b.onclick=()=>{UI.year=Number(b.dataset.y);UI.month=Number(b.dataset.m);getMonth();closeModal();render();toast(`Geöffnet: ${monthName(UI.month)} ${UI.year}`)})}

function bind(){/* Event delegation is installed once below. */}
function navigate(v){UI.view=v;render();window.scrollTo({top:0,behavior:'smooth'})}
function addEntry(cat,card){let name=card.querySelector('.newName').value.trim(),val=Number(card.querySelector('[data-new="val"]').value)||0,rec=card.querySelector('[data-new="rec"]').checked;if(!name)return toast('Bezeichnung fehlt');getMonth()[cat].push(tx(name,val,rec,cat));save();render();toast('Eintrag hinzugefügt')}
function findTx(cat,id){return getMonth()[cat].find(x=>String(x.id)===String(id))}
function deleteTx(btn){let e=btn.closest('.entry'),d=getMonth(),cat=e.dataset.cat;d[cat]=d[cat].filter(x=>String(x.id)!==String(e.dataset.id));save();render();toast('Eintrag gelöscht')}
function updateTx(el){let e=el.closest('.entry'),x=findTx(e.dataset.cat,e.dataset.id);if(!x)return;if(el.classList.contains('name'))x.name=el.value;if(el.classList.contains('amount'))x.val=Number(el.value)||0;if(el.classList.contains('rec'))x.recurring=el.checked;save();render()}
function addAsset(){state.assets.push({id:String(Date.now()),name:'Neues Asset',value:0,type:'ETF',cost:0,rate:7});save();render()}
function updateAsset(el){let a=state.assets.find(x=>String(x.id)===el.closest('.assetCard').dataset.asset);if(!a)return;if(el.classList.contains('assetName'))a.name=el.value;if(el.classList.contains('assetVal'))a.value=Number(el.value)||0;if(el.classList.contains('assetType'))a.type=el.value;save();render()}
function deleteAsset(b){state.assets=state.assets.filter(a=>String(a.id)!==b.closest('.assetCard').dataset.asset);save();render()}
function addDebt(){state.liabilities.push({id:String(Date.now()),name:'Neue Schuld',value:0,type:'Schuld'});save();render()}
function updateDebt(el){let d=state.liabilities.find(x=>String(x.id)===el.closest('[data-debt]').dataset.debt);if(!d)return;if(el.classList.contains('debtName'))d.name=el.value;if(el.classList.contains('debtVal'))d.value=Number(el.value)||0;save();render()}
function deleteDebt(b){state.liabilities=state.liabilities.filter(x=>String(x.id)!==b.closest('[data-debt]').dataset.debt);save();render()}
function addGoal(){state.goals.push({id:String(Date.now()),name:'Neues Ziel',target:100000,current:0,deadline:2030});save();render()}
function updateGoal(el){let g=state.goals.find(x=>String(x.id)===el.closest('.goal').dataset.goal);if(!g)return;if(el.classList.contains('goalName'))g.name=el.value;if(el.classList.contains('goalTarget'))g.target=Number(el.value)||0;if(el.classList.contains('goalDeadline'))g.deadline=Number(el.value)||0;save();render()}
function deleteGoal(b){state.goals=state.goals.filter(g=>String(g.id)!==b.closest('.goal').dataset.goal);save();render()}
function applyRecurring(){let d=getMonth();for(const cat of ['income','expenses','invest'])for(const x of d[cat])if(x.recurring&&x.val===0)x.val=0;let prev=new Date(UI.year,UI.month-2,1),p=getMonth(prev.getFullYear(),prev.getMonth()+1,false);if(!p){toast('Kein Vormonat vorhanden');return}for(const cat of ['income','expenses','invest'])for(const x of p[cat]||[])if(x.recurring&&!d[cat].some(y=>y.name===x.name))d[cat].push({...x,id:String(Date.now()+Math.random())});save();render();toast('Wiederkehrende Einträge übernommen')}
function copyPrev(){let p=new Date(UI.year,UI.month-2,1),src=getMonth(p.getFullYear(),p.getMonth()+1,false),d=getMonth();if(!src){toast('Kein Vormonat vorhanden');return}for(const cat of ['income','expenses','invest'])d[cat]=(src[cat]||[]).map(x=>({...x,id:String(Date.now()+Math.random())}));save();render();toast('Vormonat kopiert')}
function shift(n){let d=new Date(UI.year,UI.month-1+n,1);UI.year=d.getFullYear();UI.month=d.getMonth()+1;getMonth();render()}
function saveSettings(){let s=state.settings;s.swr=Number(document.getElementById('setSWR').value)||4;s.returnRate=Number(document.getElementById('setReturn').value)||7;s.inflation=Number(document.getElementById('setInflation').value)||2;s.emergencyMonths=Number(document.getElementById('setEmergency').value)||6;s.targetMode=document.getElementById('setMode').value;s.fixedTarget=Number(document.getElementById('setTarget').value)||1200000;s.monthlyExtra=Number(document.getElementById('setExtra').value)||0;save();render();toast('Einstellungen gespeichert')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='liquid-wealth-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup exportiert')}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||![4,5,6,7,8].includes(x.version))throw Error('Unbekanntes Format');state={...initial,...x,version:8,settings:{...defaults,...(x.settings||{})},months:x.months||{},assets:x.assets||[],liabilities:x.liabilities||[],goals:x.goals||[]};save();render();toast('Backup importiert')}catch(err){toast('Import fehlgeschlagen')}};r.readAsText(f)}
function reset(){if(!confirm('Wirklich Demo-Daten zurücksetzen?'))return;state=structuredClone?structuredClone(initial):JSON.parse(JSON.stringify(initial));state.months[key()]=demoMonth();save();render();toast('Demo-Daten zurückgesetzt')}
function action(a){
 if(a==='quick')return openQuick();
 if(a==='copyPrev')return copyPrev();
 if(a==='applyRecurring')return applyRecurring();
 if(a==='addAsset')return addAsset();
 if(a==='addDebt')return addDebt();
 if(a==='addGoal')return addGoal();
 if(a==='saveSettings')return saveSettings();
 if(a==='export')return exportData();
 if(a==='reset')return reset();
 if(a==='refreshCrypto')return fetchCoins(true);
 if(a==='rerunRisk'){UI.risk=null;render();return toast('Risikoanalyse neu simuliert');}
 if(a==='resetSim'){UI.sim={...UI.sim,extra:2000,returnRate:7,crash:0};return render();}
 if(a==='prevMonth')return shift(-1);
 if(a==='nextMonth')return shift(1);
 if(a==='today'){UI.year=now.getFullYear();UI.month=now.getMonth()+1;getMonth();return render();}
 if(a==='calendar')return openCalendar();
 if(a==='toggleAppearance'){UI.dark=!UI.dark;localStorage.setItem(APP+'_dark',UI.dark?'1':'0');applyAppearance();return render();}
 if(a==='toggleStealth'){UI.stealth=!UI.stealth;return render();}
 if(a==='openSettings')return navigate('settings');
 if(a==='closeModal')return closeModal();
 if(a==='deleteTx')return deleteTx(document.querySelector(`[data-id=\"${CSS.escape(UI.lastActionId||'')}\"]`));
}
function openQuick(){let body=`<div class="formGrid"><div class="field"><label>Kategorie</label><select class="input" id="quickCat"><option value="income">Einnahmen</option><option value="expenses">Ausgaben</option><option value="invest">Investment</option></select></div><div class="field"><label>Betrag</label><input class="input" id="quickVal" type="number" step="0.01"></div><div class="field full"><label>Bezeichnung</label><input class="input" id="quickName" placeholder="z. B. Gehalt"></div><div class="field"><label>Wiederkehrend</label><select class="input" id="quickRec"><option value="1">Ja</option><option value="0">Nein</option></select></div></div><div class="actions"><button class="primary" id="quickSave">Speichern</button></div>`;openModal('Schneller Eintrag',`Für ${monthName(UI.month)} ${UI.year}`,body);document.getElementById('quickSave').onclick=()=>{let c=document.getElementById('quickCat').value,n=document.getElementById('quickName').value.trim(),v=Number(document.getElementById('quickVal').value)||0,r=document.getElementById('quickRec').value==='1';if(!n)return toast('Bezeichnung fehlt');getMonth()[c].push(tx(n,v,r,c));save();closeModal();render();toast('Eintrag gespeichert')}
}
function openModal(title,sub,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalSub').textContent=sub;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function normalRandom(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function runMonteCarlo(){let d=getMonth(),target=fireTarget(d),start=netWorth(),monthly=totals(d).invest+Number(state.settings.monthlyExtra||0),mu=Number(state.settings.returnRate)/100,vol=.16,horizon=15,paths=1000,hit=0,terminal=[];for(let p=0;p<paths;p++){let w=start;for(let y=0;y<horizon;y++){let r=mu+vol*normalRandom();r=Math.max(-.45,Math.min(.45,r));for(let m=0;m<12;m++)w=Math.max(0,w*(1+r/12)+monthly)}if(w>=target)hit++;terminal.push(w)}terminal.sort((a,b)=>a-b);return{success:hit/paths*100,p10:terminal[Math.floor(paths*.1)],p50:terminal[Math.floor(paths*.5)],p90:terminal[Math.floor(paths*.9)],target,horizon,paths}}
function risk(){let d=getMonth(),r=UI.risk||(UI.risk=runMonteCarlo()),fy=fireYears(d),color=r.success>=80?'green':r.success>=60?'orange':'red';let bars=[['10%',r.p10],['Median',r.p50],['90%',r.p90]];return `<div class="toolbar"><div><h1 class="sectionTitle">Risikoanalyse</h1><p class="sectionSub">Monte-Carlo-Stresstest mit 1.000 Renditepfaden. Er zeigt, wie robust dein aktueller FIRE-Plan gegen unterschiedliche Börsenverläufe ist.</p></div><button class="primary" data-action="rerunRisk"><span class="icon">${I('pulse')}</span>Neu simulieren</button></div><div class="riskGrid"><div class="riskMetric"><span>FIRE-Erreichung in ${r.horizon} Jahren</span><b class="${color}">${pct(r.success)}</b></div><div class="riskMetric"><span>Median Vermögen</span><b class="sensitive">${euro(r.p50)}</b></div><div class="riskMetric"><span>Schwaches 10%-Szenario</span><b class="sensitive red">${euro(r.p10)}</b></div><div class="riskMetric"><span>Starkes 90%-Szenario</span><b class="sensitive green">${euro(r.p90)}</b></div></div><div class="grid wide" style="margin-top:14px"><div class="card"><div class="toolbar"><div><h2>Verteilung der Ergebnisse</h2><span class="sub">Start ${euro(netWorth())} · Ziel ${euro(r.target)} · Rendite ${pct(state.settings.returnRate)} · Volatilität 16%</span></div></div><canvas id="riskCanvas" class="riskCanvas"></canvas></div><div class="card"><h2>Einordnung</h2>${stat('Konventioneller FIRE Countdown',fy===999?'N/A':fy.toFixed(1)+' Jahre')}${stat('Simulationshorizont',r.horizon+' Jahre')}${stat('Pfade',r.paths.toLocaleString('de-DE'))}${stat('FIRE Ziel',euro(r.target))}<div class="notice" style="margin-top:12px">Die Simulation ist ein Planungsmodell, keine Prognose. Sie berücksichtigt eine variable Renditereihenfolge und macht das Sequence-of-Returns-Risiko sichtbar. Inflation und Steuern sind nicht separat modelliert.</div></div></div>`}
function drawRisk(){let c=document.getElementById('riskCanvas');if(!c)return;let r=UI.risk||(UI.risk=runMonteCarlo()),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);let vals=[],mu=state.settings.returnRate/100,vol=.16,start=netWorth(),monthly=totals(getMonth()).invest+Number(state.settings.monthlyExtra||0),target=r.target;for(let p=0;p<500;p++){let x=start;for(let y=0;y<r.horizon;y++){let rr=Math.max(-.45,Math.min(.45,mu+vol*normalRandom()));for(let m=0;m<12;m++)x=Math.max(0,x*(1+rr/12)+monthly)}vals.push(x)}vals.sort((a,b)=>a-b);let max=Math.max(...vals,target),pad=35;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad,h-28);ctx.lineTo(w-pad,h-28);ctx.stroke();let bins=28,counts=new Array(bins).fill(0);vals.forEach(v=>counts[Math.min(bins-1,Math.floor(v/max*bins))]++);let bw=(w-2*pad)/bins;counts.forEach((n,i)=>{let bh=(h-55)*n/Math.max(...counts);ctx.fillStyle='#1688ff';ctx.fillRect(pad+i*bw,h-29-bh,bw-3,bh)});let tx=pad+target/max*(w-2*pad);ctx.strokeStyle='#ff4f70';ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(tx,18);ctx.lineTo(tx,h-25);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff6a85';ctx.font='11px Inter, sans-serif';ctx.fillText('FIRE Ziel',Math.min(tx+6,w-85),28)}
function applyAppearance(){document.documentElement.classList.toggle('light',!UI.dark);document.documentElement.style.colorScheme=UI.dark?'dark':'light';const b=document.getElementById('appearanceToggle');if(!b)return;const icon=document.getElementById('appearanceIcon');const text=document.getElementById('appearanceText');if(icon)icon.setAttribute('data-icon',UI.dark?'sun':'moon');if(text)text.textContent=UI.dark?'Light Mode':'Dark Mode';b.title=UI.dark?'Zu Light Mode wechseln':'Zu Dark Mode wechseln';}
function render(){document.getElementById('monthLabel').textContent=`${monthName(UI.month)} ${UI.year}`;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===UI.view));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===UI.view));document.getElementById('dashboard').innerHTML=dashboard();document.getElementById('wealth').innerHTML=wealth();document.getElementById('cashflow').innerHTML=cashflow();document.getElementById('fire').innerHTML=fire();document.getElementById('simulator').innerHTML=simulator();document.getElementById('projection').innerHTML=projection();document.getElementById('year').innerHTML=year();document.getElementById('portfolio').innerHTML=portfolio();document.getElementById('crypto').innerHTML=crypto();document.getElementById('goals').innerHTML=goals();document.getElementById('financeCheck').innerHTML=financeCheck();document.getElementById('risk').innerHTML=risk();document.getElementById('settings').innerHTML=settings();applyAppearance();document.body.classList.toggle('stealth',UI.stealth);paintIcons();if(UI.view==='risk')drawRisk()}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
async function fetchCoins(force=false){try{let r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&order=market_cap_desc&per_page=12&page=1&sparkline=false',{cache:'no-store'});if(!r.ok)throw Error();UI.coins=await r.json();document.getElementById('coinMini').innerHTML=UI.coins.slice(0,5).map(c=>`<div class="coinMini"><b>${esc(c.symbol.toUpperCase())}</b><span>${euro(c.current_price)}</span><em>${c.price_change_percentage_24h>=0?'+':''}${(c.price_change_percentage_24h||0).toFixed(1)}%</em></div>`).join('');if(UI.view==='crypto')render()}catch(e){document.getElementById('coinMini').innerHTML='<span class="muted" style="font-size:10px">Live-Daten offline</span>';if(force)toast('CoinGecko nicht erreichbar')}}

document.addEventListener('click',function(e){
 const b=e.target.closest('button');
 if(!b)return;
 if(b.dataset.view){e.preventDefault();return navigate(b.dataset.view);}
 if(b.dataset.nav){e.preventDefault();return navigate(b.dataset.nav);}
 if(b.dataset.crash!==undefined){e.preventDefault();UI.sim.crash=Number(b.dataset.crash);return render();}
 if(b.dataset.action){e.preventDefault();return action(b.dataset.action);}
 if(b.classList.contains('addEntry')){e.preventDefault();return addEntry(b.dataset.cat,b.closest('.card'));}
 if(b.classList.contains('del')){e.preventDefault();return deleteTx(b);}
 if(b.classList.contains('assetDel')){e.preventDefault();return deleteAsset(b);}
 if(b.classList.contains('debtDel')){e.preventDefault();return deleteDebt(b);}
 if(b.classList.contains('goalDel')){e.preventDefault();return deleteGoal(b);}
});
document.addEventListener('change',function(e){
 const t=e.target;
 if(t.matches('.entry .name,.entry .amount,.entry .rec')) return updateTx(t);
 if(t.matches('.assetName,.assetVal,.assetType')) return updateAsset(t);
 if(t.matches('.debtName,.debtVal')) return updateDebt(t);
 if(t.matches('.goalName,.goalTarget,.goalDeadline')) return updateGoal(t);
 if(t.id==='yearSelect'){UI.year=Number(t.value);return render();}
 if(t.id==='importFile')return importData({target:t});
});
document.addEventListener('input',function(e){
 const t=e.target;
 if(t.id==='dashExtra'||t.id==='simExtra'){UI.sim.extra=Number(t.value);return render();}
 if(t.id==='simReturn'){UI.sim.returnRate=Number(t.value);return render();}
});
UI.dark=localStorage.getItem(APP+'_dark')!=='0';
applyAppearance();
render();fetchCoins();setInterval(()=>fetchCoins(),60000);
</script></body></html>
