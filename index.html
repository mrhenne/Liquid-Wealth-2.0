<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Liquid Wealth Tactical Engine">
<title>Liquid Wealth Tactical Engine</title>
<link rel="stylesheet" href="assets/css/app.css">





<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liquid Wealth">


</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">LW</div><div class="brandText"><b>Liquid Wealth</b><small>Personal Wealth OS · Tactical Engine</small></div></div>
<nav class="nav" id="nav"><button class="active" data-view="dashboard"><span class="ico" data-icon="home"></span><span class="navText">Dashboard</span></button><button data-view="wealth"><span class="ico" data-icon="wallet"></span><span class="navText">Vermögen</span></button><button data-view="cashflow"><span class="ico" data-icon="flow"></span><span class="navText">Cashflow</span></button><button data-view="fire"><span class="ico" data-icon="fire"></span><span class="navText">FIRE</span></button><button data-view="simulator"><span class="ico" data-icon="sliders"></span><span class="navText">Simulator</span></button><button data-view="projection"><span class="ico" data-icon="chart"></span><span class="navText">Projektion</span></button><button data-view="year"><span class="ico" data-icon="calendar"></span><span class="navText">Jahresübersicht</span></button><button data-view="portfolio"><span class="ico" data-icon="pie"></span><span class="navText">Portfolio</span></button><button data-view="crypto"><span class="ico" data-icon="coin"></span><span class="navText">Krypto</span></button><button data-view="goals"><span class="ico" data-icon="target"></span><span class="navText">Meilensteine</span></button><button data-view="financeCheck"><span class="ico" data-icon="shield"></span><span class="navText">Finanz-Check</span></button><button data-view="risk"><span class="ico" data-icon="pulse"></span><span class="navText">Risikoanalyse</span></button><button data-view="settings"><span class="ico" data-icon="settings"></span><span class="navText">Einstellungen</span></button></nav>
<div class="sidebarBottom"><div class="status"><h4><span class="dot"></span>Live Crypto</h4><div id="coinMini"></div><small class="muted">CoinGecko optional</small></div></div></aside>
<main class="main"><header class="top">
<div class="topLeft">
  <button class="monthBtn" id="prev" data-action="prevMonth" title="Vorheriger Monat"><span class="icon" data-icon="chevronLeft"></span></button>
  <button class="monthLabel ghost" id="monthLabel" data-action="calendar" title="Kalender öffnen"><span class="icon" data-icon="calendar"></span><span id="monthLabelText"></span></button>
  <button class="monthBtn" id="next" data-action="nextMonth" title="Nächster Monat"><span class="icon" data-icon="chevronRight"></span></button>
  <button class="ghost hideMobile" id="today" data-action="today"><span class="icon" data-icon="today"></span>Heute</button>
</div>
<div class="topCenter">
  <label class="searchBar" title="Suchen im aktuellen Bereich">
    <span class="icon" data-icon="search"></span>
    <input id="globalSearch" type="search" placeholder="Suche in der aktuellen Ansicht">
    <span class="keyHint">/</span>
  </label>
</div>
<div class="topRight">
  <button class="ghost" id="calendarBtn" data-action="calendar" title="Kalender öffnen"><span class="icon" data-icon="calendar"></span><span class="hideMobile">Kalender</span></button>
  <button class="topBtn hideMobile" id="addQuick" data-action="quick"><span class="icon" data-icon="plus"></span>Eintrag</button>
  <button class="topBtn hideMobile" id="backupTop" data-action="export" title="Backup als JSON speichern"><span class="icon" data-icon="download"></span>Backup</button>
  <button class="topBtn hideMobile" id="importTop" data-action="chooseImport" title="Backup importieren"><span class="icon" data-icon="upload"></span>Import</button>
  <button class="topBtn appearanceBtn" id="appearanceToggle" data-action="toggleAppearance" title="Erscheinungsbild wechseln"><span class="icon" id="appearanceIcon" data-icon="moon"></span><span class="themeText" id="appearanceText">Light Mode</span></button>
  <button class="topBtn" id="stealth" data-action="toggleStealth"><span class="icon" data-icon="eyeOff"></span><span class="hideMobile">Stealth</span></button>
  <button class="primary" id="openSettings" data-action="openSettings" title="Einstellungen"><span class="icon" data-icon="settings"></span><span class="hideMobile">Einstellungen</span></button>
  <div class="userPill"><div class="avatar">LW</div><div class="userMeta"><b>Liquid Wealth</b><small>Private Dashboard</small></div></div>
</div>
</header><div class="content">
<section id="dashboard" class="view active"></section><section id="wealth" class="view"></section><section id="cashflow" class="view"></section><section id="fire" class="view"></section><section id="simulator" class="view"></section><section id="projection" class="view"></section><section id="year" class="view"></section><section id="portfolio" class="view"></section><section id="crypto" class="view"></section><section id="goals" class="view"></section><section id="financeCheck" class="view"></section><section id="risk" class="view"></section><section id="settings" class="view"></section><div class="footer">Liquid Wealth · Personal Wealth OS · lokal mit Sicherheitsnetz · Cloud-ready</div>
</div></main></div>

<nav class="mobileDock" id="mobileDock" aria-label="Mobile Navigation">
  <button data-view="dashboard"><span class="icon" data-icon="home"></span><span>Home</span></button>
  <button data-view="wealth"><span class="icon" data-icon="wallet"></span><span>Vermögen</span></button>
  <button data-view="cashflow"><span class="icon" data-icon="flow"></span><span>Cashflow</span></button>
  <button data-view="fire"><span class="icon" data-icon="fire"></span><span>FIRE</span></button>
  <button data-action="toggleMobileMenu"><span class="icon" data-icon="menu"></span><span>Mehr</span></button>
</nav>
<div class="mobileSheet" id="mobileMenu" aria-hidden="true">
  <div class="scrim" data-action="toggleMobileMenu"></div>
  <div class="mobileSheetPanel">
    <div class="mobileSheetHead"><b>Liquid Wealth</b><button data-action="toggleMobileMenu" aria-label="Schließen"><span class="icon" data-icon="close"></span></button></div>
    <div class="mobileSheetGrid">
      <button data-view="simulator"><span class="icon" data-icon="sliders"></span>Simulator</button>
      <button data-view="projection"><span class="icon" data-icon="chart"></span>Projektion</button>
      <button data-view="year"><span class="icon" data-icon="calendar"></span>Jahresübersicht</button>
      <button data-view="portfolio"><span class="icon" data-icon="pie"></span>Portfolio</button>
      <button data-view="crypto"><span class="icon" data-icon="btc"></span>Krypto</button>
      <button data-view="goals"><span class="icon" data-icon="milestone"></span>Meilensteine</button>
      <button data-view="financeCheck"><span class="icon" data-icon="shield"></span>Finanz-Check</button>
      <button data-view="risk"><span class="icon" data-icon="pulse"></span>Risikoanalyse</button>
      <button data-view="settings"><span class="icon" data-icon="settings"></span>Einstellungen</button>
    </div>
  </div>
</div>
<div class="modal" id="modal"><div class="modalBox"><div class="toolbar"><div><h2 id="modalTitle">Eintrag</h2><div class="sub" id="modalSub"></div></div><button class="ghost" id="closeModal" data-action="closeModal">Schließen</button></div><div id="modalBody"></div></div></div><input id="globalImportFile" type="file" accept=".json,application/json" hidden><div class="toast" id="toast"></div>
<script src="assets/js/app.js"></script>
<script>
setTimeout(function(){
  if(!window.__LIQUID_WEALTH_BOOTED__){
    var n=document.createElement('div');
    n.setAttribute('role','alert');
    n.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;padding:12px 14px;border-radius:12px;background:#35101d;color:#fff;border:1px solid #8a2946;font:14px system-ui';
    n.textContent='Liquid Wealth konnte nicht vollständig geladen werden. Bitte Seite neu laden oder den letzten stabilen Stand verwenden.';
    document.body.appendChild(n);
  }
},2500);
</script></body></html>
